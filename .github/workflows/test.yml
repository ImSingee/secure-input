name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Go and Web Crypto interoperability
        run: go test -race ./...
        env:
          SECURE_INPUT_REQUIRE_NODE: '1'
      - name: Vet
        run: go vet ./...
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test real browser and CLI flow
        run: |
          go build -o secure-input .
          node web/browser_test.cjs
