name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write # needed to publish GitHub releases on tags

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false # no dependencies, nothing to cache

      - name: Test
        run: go test ./...

      - name: Build snapshot artifacts (branch pushes)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Publish release (tag pushes)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One artifact per platform, so each shows up as its own download on
      # the run's Summary page. Raw binaries and goreleaser metadata in dist/
      # are left out; the archives already contain the binaries.
      - name: Upload linux/amd64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-linux-amd64
          path: dist/*_linux_amd64.tar.gz
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-linux-arm64
          path: dist/*_linux_arm64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-darwin-amd64
          path: dist/*_darwin_amd64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-darwin-arm64
          path: dist/*_darwin_arm64.tar.gz
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-windows-amd64
          path: dist/*_windows_amd64.zip
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-windows-arm64
          path: dist/*_windows_arm64.zip
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}-checksums
          path: dist/checksums.txt
          if-no-files-found: error
