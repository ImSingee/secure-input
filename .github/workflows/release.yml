name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write # needed to publish GitHub releases on tags

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false # no dependencies, nothing to cache

      - name: Test
        run: go test ./...

      - name: Build snapshot artifacts (branch pushes)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Publish release (tag pushes)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secure-input-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
